# website-building 静态站（容器内 nginx）
#
# 托管静态站；同时把**内容后台的登录链路**反代进来：
#   /oauth2/  → Casdoor 回跳（重定向 URL 登记的是公网 3019，得落在这里）
#   /admin    → 后台界面（带鉴权，公网可用）
#   /api/     → 后台接口（登录守卫在后台服务里，未登录一律 401）
#
# 静态站没有 /api /oauth2 /admin 路径，不会撞。
# 127.0.0.1:3020 直连后台的用法保留 —— SSH 隧道运维用。
#
# 静态站是 Next.js 静态导出，带 trailingSlash：
#   /insights → /insights/ → /insights/index.html
# 所以要用 try_files 逐级回退，不能只写 $uri。

server {
    listen 8080;
    server_name _;

    root /srv/app/site;
    index index.html;

    charset utf-8;

    # ── 内容后台（登录链路 + 界面 + 接口）────────────────
    # cookie 由后台签发（Host 作用域），3019 上登录一次，/admin 与 /api/ 都认。
    location = /admin {
        proxy_pass http://127.0.0.1:5105;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /oauth2/ {
        proxy_pass http://127.0.0.1:5105;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:5105;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # ── 静态站 ──────────────────────────────────────────
    location / {
        # trailingSlash 的 Next.js 导出：目录 → index.html
        try_files $uri $uri/ $uri/index.html =404;
    }

    # 知识库产物 —— 不缓存（内容会随发布变）
    location /_geo/ {
        add_header Cache-Control "no-cache";
    }

    # llms.txt / robots.txt —— AI 发现文件，每次都取最新
    location ~ ^/(llms\.txt|llms-full\.txt|robots\.txt|sitemap\.xml)$ {
        add_header Cache-Control "no-cache";
        add_header Content-Type "text/plain; charset=utf-8";
    }

    # 静态资源缓存
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
