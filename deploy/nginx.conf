# website-building 静态站（容器内 nginx）
#
# 只托管静态站。内容后台是**独立端口**（5105），不反代到这里 ——
# 后台界面的 fetch 用的是根路径 /api/...，挂到子路径下会 404。
#
# 静态站是 Next.js 静态导出，带 trailingSlash：
#   /insights → /insights/ → /insights/index.html
# 所以要用 try_files 逐级回退，不能只写 $uri。

server {
    listen 8080;
    server_name _;

    root /srv/app/site;
    index index.html;

    charset utf-8;

    # ── 静态站 ──────────────────────────────────────────
    location / {
        # trailingSlash 的 Next.js 导出：目录 → index.html
        try_files $uri $uri/ $uri/index.html =404;
    }

    # 知识库产物 —— 不缓存（内容会随发布变）
    location /_geo/ {
        add_header Cache-Control "no-cache";
    }

    # llms.txt / robots.txt —— AI 发现文件，每次都取最新
    location ~ ^/(llms\.txt|llms-full\.txt|robots\.txt|sitemap\.xml)$ {
        add_header Cache-Control "no-cache";
        add_header Content-Type "text/plain; charset=utf-8";
    }

    # 静态资源缓存
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
